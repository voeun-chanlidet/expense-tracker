services:
  postgres:
    image: postgres:17
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - expense-tracker-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  expense-tracker-postgres-data:
